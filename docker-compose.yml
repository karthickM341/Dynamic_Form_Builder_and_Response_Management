services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: dynamic_forms
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://root:password@mysql:3306/dynamic_forms
      SECRET_KEY: change-me-in-production
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [mysql,redis]
  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info -Q exports
    environment:
      DATABASE_URL: mysql+pymysql://root:password@mysql:3306/dynamic_forms
      SECRET_KEY: change-me-in-production
      REDIS_URL: redis://redis:6379/0
    depends_on: [mysql,redis]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  mysql_data:
